services:
  database:
    image: mariadb:11.4
    container_name: app_database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootsecretpassword
      MYSQL_DATABASE: evolusi_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: usersecretpassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.frankenphp
    container_name: app_backend
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:6uX3akJW8bM1l+AOkcfbaHSlMW76QOWUFBpMH3T4DXQ=
      DB_CONNECTION: mysql
      DB_HOST: database  # Resolusi DNS Docker lewat nama service
      DB_PORT: 3306
      DB_DATABASE: evolusi_db
      DB_USERNAME: appuser
      DB_PASSWORD: usersecretpassword
    ports:
      - "8000:8000"
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  db_data:
    driver: local

networks:
  app_network:
    driver: bridge
